services:
  - type: web
    name: nexus-phishing-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: CORS_ORIGINS
        value: https://nexus-phishing-detector.onrender.com
      - key: ANALYSIS_RATE_LIMIT_PER_MINUTE
        value: "60"

  - type: web
    name: nexus-phishing-detector
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nexus-phishing-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
